<div class="page-header">
    <button class="btn btn--ghost" id="back_btn">Back</button>
    <div class="detail-actions">
        <button class="btn btn--primary" id="add_payment_btn" disabled>Add Payment</button>
        <button class="btn btn--danger" id="delete_loan_btn" disabled>Delete loan</button>
    </div>
</div>
<h1 class="dashboard-title" id="detail_name">—</h1>
<p class="dashboard-subtitle">Loan details</p>

<div class="ring-card" id="bars_card" hidden>
    <div class="ring-card-header">
        <h3>Loan repayment progress</h3>
    </div>
    <div id="bars" class="loan-bars"></div>
</div>

<div class="table-card">
    <div class="table-header">
        <h3 class="table-title">Loans</h3>
    </div>
    <table class="loan-table">
        <thead>
            <tr>
                <th></th>
                <th>Principal</th>
                <th>Rate</th>
                <th>Currency</th>
                <th>Due</th>
                <th>Paid</th>
                <th>Remaining</th>
                <th>Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="detail_body"></tbody>
    </table>
</div>

<div class="table-card">
    <div class="table-header">
        <h3 class="table-title">Payment history</h3>
    </div>
    <table class="loan-table">
        <thead>
            <tr>
                <th>Amount</th>
                <th>Currency</th>
                <th>Rate</th>
                <th>Converted</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="payments_body"></tbody>
    </table>
    <div class="empty-state" id="payments_empty">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="empty-state-icon">

        <p>Select a loan above to see its payment history</p>
    </div>
</div>
