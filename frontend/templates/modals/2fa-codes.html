<div class="modal-overlay" id="tfa_backup_modal">
    <div class="modal">
        <h2 class="modal-title">Save your backup codes</h2>
        <p class="modal-subtitle">Each code works once if you lose access to your auth app.</p>
        <pre id="tfa_backup_codes" style="background:var(--bg);padding:18px;border-radius:10px;color:var(--text);font-family:monospace;text-align:center;line-height:1.9;letter-spacing:1px;margin-bottom:18px;font-size:14px"></pre>
        <div style="display:flex;gap:12px;justify-content:flex-end">
            <button class="btn btn--primary" id="tfa_backup_done_btn">I've saved them</button>
        </div>
    </div>
</div>
