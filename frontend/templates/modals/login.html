<div class="modal-overlay" id="login_modal">
    <div class="modal">
        <button class="modal-close" id="login_close" aria-label="Close">&times;</button>
        <h2 class="modal-title">Welcome Back</h2>
        <p class="modal-subtitle">Log in to your FinTrack account</p>

        <form id="login_form" class="modal-form">
            <label class="field">
                <span class="field-label">Email</span>
                <input type="email" name="email" required autocomplete="email">
            </label>
            <label class="field">
                <span class="field-label">Password</span>
                <input type="password" name="password" required autocomplete="current-password">
            </label>

            <div class="modal-forgot-link">
                <a href="#" id="go_to_forgot">Forgot password?</a>
            </div>

            <div class="modal-error" id="login_error" hidden></div>

            <button type="submit" class="btn btn--primary btn--full">Log In</button>
        </form>
        <p class="modal-footer-text">
            Don't have an account? <a href="#" id="go_to_register">Register</a>
        </p>
    </div>
</div>
