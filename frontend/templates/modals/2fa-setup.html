<div class="modal-overlay" id="tfa_setup_modal">
    <div class="modal">
        <button class="modal-close" type="button" data-close-modal>&times;</button>
        <h2 class="modal-title">Set up two-factor authentication</h2>
        <ol style="font-size:14px;color:var(--text2);padding-left:20px;margin-bottom:18px;line-height:1.7">
            <li>Open your auth app</li>
            <li>Scan this QR code or paste the secret manually.</li>
            <li>Enter the current 6-digit code below to confirm.</li>
        </ol>
        <div style="text-align:center;margin-bottom:14px">
            <img id="tfa_qr" alt="QR code" style="background:#fff;padding:12px;border-radius:10px;width:180px;height:180px">
        </div>
        <div class="field">
            <label class="field-label">Or enter manually</label>
            <input type="text" class="form-input" id="tfa_secret" readonly style="font-family:monospace;letter-spacing:1px;text-align:center">
        </div>
        <div class="field">
            <label class="field-label">6-digit code from your app</label>
            <input type="text" class="form-input" id="tfa_setup_code" maxlength="6" inputmode="numeric" style="text-align:center;letter-spacing:6px;font-size:18px">
            <div class="modal-error" id="tfa_setup_error" hidden></div>
        </div>
        <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:16px">
            <button class="btn btn--ghost" type="button" data-close-modal>Cancel</button>
            <button class="btn btn--primary" id="tfa_setup_verify_btn">Verify and enable</button>
        </div>
    </div>
</div>
