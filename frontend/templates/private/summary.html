<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary</title>
    <link rel="icon" type="image/png" href="/images/logo/icon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS file -->
    <link rel="stylesheet" href="/static/styles/style.css">
    <!-- Scripts -->
    <script type="module" src="/static/js/api.js"></script>
    <script type="module" src="/static/js/shell.js"></script>
    <script type="module" src="/static/js/summary.js"></script>
</head>
<body>
    <!-- Background glow orbs -->
    <div class="glow-orb glow-orb--tl"></div>
    <div class="glow-orb glow-orb--tr"></div>
    <div class="glow-orb glow-orb--bl"></div>
    <div class="glow-orb glow-orb--br"></div>

    <!-- Nav and sidebar injected by shell.js -->
    <div class="dashboard-layout">
        <main class="dashboard-main">
            <div class="page-header">
                <div>
                    <h1 class="dashboard-title">Summary</h1>
                    <p class="dashboard-subtitle">Financial breakdown by date range</p>
                </div>
                <div class="date-range">
                    <span class="date-range-label">From</span>
                    <input type="date" name="from">
                    <span class="date-range-label">To</span>
                    <input type="date" name="to">
                    <button class="btn btn--ghost btn--small" id="this_month_btn">This Month</button>
                </div>
            </div>

            <div class="stat-cards" id="stat_cards"></div>

            <div class="charts-row">
                <div class="chart-card">
                    <div class="chart-card-header">
                        <h3>Expenses by Category</h3>
                    </div>
                    <div class="donut-layout">
                        <div class="donut" id="category_donut"></div>
                        <div class="donut-legend" id="donut_legend"></div>
                    </div>
                </div>

                <div class="chart-card">
                    <div class="chart-card-header">
                        <h3>By Payment Method</h3>
                    </div>
                    <div id="method_bars" class="method-bars"></div>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-card-header">
                    <h3>Daily Spending</h3>
                </div>
                <div class="line-wrap" id="daily_line"></div>
            </div>
        </main>
    </div>
</body>
</html>
