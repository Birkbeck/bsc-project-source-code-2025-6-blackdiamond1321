<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="icon" type="image/png" href="/images/logo/icon.png">
    <!-- Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS file-->
    <link rel="stylesheet" href="/static/styles/style.css">
    <!-- Scripts -->
    <script type="module" src="/static/js/api.js"></script>
    <script type="module" src="/static/js/shell.js"></script>
    <script type="module" src="/static/js/settings.js"></script>
</head>
<body>
    <!-- Background glow orbs -->
    <div class="glow-orb glow-orb--tl"></div>
    <div class="glow-orb glow-orb--tr"></div>
    <div class="glow-orb glow-orb--bl"></div>
    <div class="glow-orb glow-orb--br"></div>

    <!-- Nav and sidebar injected by shell.js -->
    <div class="dashboard-layout">
        <main class="dashboard-main">
            <div class="page-header">
                <div>
                    <h1 class="dashboard-title">Settings</h1>
                    <p class="dashboard-subtitle">Manage your account</p>
                </div>
            </div>
            <div class="settings-section">
                <div class="settings-card">
                    <h3>Profile Details</h3>
                    <p class="settings-desc">Update your name and email address.</p>
                    <form id="profile_form" class="settings-form">
                        <div class="settings-row">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" class="form-input" name="first_name" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" class="form-input" name="last_name" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" class="form-input" name="email" required>
                        </div>
                        <div class="settings-actions">
                            <button class="btn btn--primary" type="submit">Save Changes</button>
                            <span class="settings-msg" id="profile_msg"></span>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
