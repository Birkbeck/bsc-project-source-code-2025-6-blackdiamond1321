<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loans</title>
    <link rel="icon" type="image/png" href="/images/logo/icon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS file -->
    <link rel="stylesheet" href="/static/styles/style.css">
    <!-- Scripts -->
    <script type="module" src="/static/js/api.js"></script>
    <script type="module" src="/static/js/shell.js"></script>
    <script type="module" src="/static/js/loans.js"></script>
</head>
<body>
    <!-- Background glow orbs -->
    <div class="glow-orb glow-orb--tl"></div>
    <div class="glow-orb glow-orb--tr"></div>
    <div class="glow-orb glow-orb--bl"></div>
    <div class="glow-orb glow-orb--br"></div>

    <!-- Nav and sidebar injected by shell.js -->
    <div class="dashboard-layout">
        <main class="dashboard-main">
            <div class="page-header">
                <div>
                    <h1 class="dashboard-title">Loans</h1>
                    <p class="dashboard-subtitle">Track money lent, owed, and payments back</p>
                </div>
                <button class="btn btn--primary" data-action="add-loan">Add Loan</button>
            </div>

            <div class="table-card">
                <div class="table-header">
                    <h3 class="table-title">Borrowers</h3>
                    <span class="table-count" id="borrower_count">0 borrowers</span>
                </div>
                <table class="loan-table" id="borrowers_table">
                    <thead>
                        <tr>
                            <th>Borrower</th>
                            <th>Loans</th>
                            <th>Lent</th>
                            <th>Due</th>
                            <th>Paid</th>
                            <th>Remaining</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="borrowers_body"></tbody>
                </table>
                <div class="empty-state" id="loans_empty" hidden>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="empty-state-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z" />
                    </svg>
                    <h3>No loans yet</h3>
                    <p>Record money you've lent to someone</p>
                </div>
            </div>

            <!-- Modal root -->
            <div id="modal-root"></div>
        </main>
    </div>
</body>
</html>
