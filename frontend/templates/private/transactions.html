<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions</title>
    <link rel="icon" type="image/png" href="/images/logo/icon.png">
    <!-- Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS file-->
    <link rel="stylesheet" href="/static/styles.css">
    <!-- Scripts -->
    <script type="module" src="/static/js/api.js"></script>
    <script type="module" src="/static/js/shell.js"></script>
    <script type="module" src="/static/js/transactions.js"></script>
</head>
<body>
    <!-- Background glow orbs -->
    <div class="glow-orb glow-orb--tl"></div>
    <div class="glow-orb glow-orb--tr"></div>
    <div class="glow-orb glow-orb--bl"></div>
    <div class="glow-orb glow-orb--br"></div>

    <!-- Nav and sidebar injected by shell.js -->
    <div class="dashboard-layout">
        <main class="dashboard-main">
            <h1 class="dashboard-title">Transactions</h1>
            <p class="dashboard-subtitle">Manage your income and expenses</p>
            <div class="table-card">
                <div class="table-header">
                    <h3 class="table-title">All Transactions</h3>
                    <span class="table-count" id="transaction_count">0 transaction</span>
                </div>
                <table class="transaction-table" id="transaction_table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Method</th>
                            <th class="transaction-col-amount">Amount</th>
                            <th class="transaction-col-actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="transactions_body"></tbody>
                </table>
                <!-- Show placeholder when there are no transactions -->
                <!-- Card icon -->
                <div class="empty-state" id="transaction_empty" hidden>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="empty-state-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Z" />
                    </svg>
                    <h3>No transactions yet</h3>
                    <p>Add your first transaction</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
