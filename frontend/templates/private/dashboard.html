<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" type="image/png" href="/images/logo/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script type="module" src="/static/js/api.js"></script>
    <script type="module" src="/static/js/dashboard.js"></script>
</head>
<body>
    <!-- Background glow orbs -->
    <div class="glow-orb glow-orb--tl"></div>
    <div class="glow-orb glow-orb--tr"></div>
    <div class="glow-orb glow-orb--bl"></div>
    <div class="glow-orb glow-orb--br"></div>

    <!-- Navigation -->
    <nav>
        <a href="/dashboard" class="logo">
            <img src="/images/logo/icon.png" alt="" class="logo-icon-img">
            <span class="logo-text"><span class="highlight">FinTrack</span></span>
        </a>
        <div class="nav-cta">
            <span class="nav-user" id="user_name"></span>
            <button class="btn btn--ghost" id="logout_btn">Log out</button>
        </div>
    </nav>
</body>
</html>
