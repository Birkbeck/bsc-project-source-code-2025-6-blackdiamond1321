<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fintrack</title>
    <link rel="icon" type="image/png" href="/images/logo/icon.png">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">
                <img src="/images/logo/logo.png" alt="Fintrack">
            </a>
            <div class="auth">
                <button id="login_btn">Log In</button>
                <button id="register_btn">Register</button>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Track your money, stay in control</h1>
            <p>Record income and expenses manually across cash, debit, and credit. No bank linking required.</p>
            <button class="primary-btn" id="get_str_btn">Get started</button>
        </section>
    </main>
</body>
</html>
